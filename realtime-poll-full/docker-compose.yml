version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: poll-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: poll_pass
      POSTGRES_DB: realtime_poll
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CORS_ORIGIN=http://localhost:5173
      - DATABASE_URL=postgresql://postgres:poll_pass@postgres:5432/realtime_poll
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:

